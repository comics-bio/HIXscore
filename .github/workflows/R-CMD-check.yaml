on: [push, pull_request]
name: R-CMD-check
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # HIXscore supports Seurat 4.3 - 4.4 only; the package repositories carry Seurat 5, so 4.x comes from the CRAN archive
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            url::https://cran.r-project.org/src/contrib/Archive/SeuratObject/SeuratObject_4.1.4.tar.gz
            url::https://cran.r-project.org/src/contrib/Archive/Seurat/Seurat_4.4.0.tar.gz
      - uses: r-lib/actions/check-r-package@v2
